services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sospirato
      POSTGRES_USER: sospirato
      POSTGRES_PASSWORD: sospirato
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sospirato-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sospirato -d sospirato"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sospirato-postgres:
