openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog
  - name: sales
    description: Sales tracking
  - name: dashboard
    description: Sales summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get sales totals for the current day and week
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List all catalog products, including inactive products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Add a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "404":
          description: Product not found
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List recent sales
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Register a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid sale
  /sales/{id}/cancel:
    post:
      operationId: cancelSale
      tags: [sales]
      summary: Cancel a sale without deleting its history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          description: Sale not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
          minimum: 0
        category:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, price, category, isActive, createdAt, updatedAt]
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: integer
          minimum: 0
        category:
          type: ["string", "null"]
      required: [name, price]
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: integer
          minimum: 0
        category:
          type: ["string", "null"]
        isActive:
          type: boolean
    SaleItemInput:
      type: object
      properties:
        productId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 999
      required: [productId, quantity]
    SaleInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SaleItemInput"
        paymentMethod:
          type: string
          enum: [cash, transfer, card, nequi, bancolombia, other]
        customerName:
          type: ["string", "null"]
          maxLength: 120
        note:
          type: ["string", "null"]
          maxLength: 500
      required: [items, paymentMethod]
    SaleLine:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: ["integer", "null"]
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
        subtotal:
          type: integer
      required: [id, productId, productName, quantity, unitPrice, subtotal]
    Sale:
      type: object
      properties:
        id:
          type: integer
        total:
          type: integer
        paymentMethod:
          type: string
          enum: [cash, transfer, card, nequi, bancolombia, other]
        customerName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [completed, cancelled]
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: ["string", "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleLine"
      required: [id, total, paymentMethod, customerName, note, status, createdAt, cancelledAt, items]
    TopProduct:
      type: object
      properties:
        productName:
          type: string
        quantity:
          type: integer
        total:
          type: integer
      required: [productName, quantity, total]
    DashboardSummary:
      type: object
      properties:
        todayTotal:
          type: integer
        todayCount:
          type: integer
        weekTotal:
          type: integer
        weekCount:
          type: integer
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
      required: [todayTotal, todayCount, weekTotal, weekCount, topProducts]

